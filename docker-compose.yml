services:
  postgres:
    image: postgres:15-alpine
    container_name: wagering_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Pinned: never `latest` — reproducible builds.
    image: localstack/localstack:4.4
    container_name: wagering_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # healthy only after the init scripts (queue creation) completed
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 3s
      retries: 40

  # ---------------------------------------------------------------- identity provider (profile "auth")
  # docker compose --profile auth up -d --wait keycloak
  # Realm "wagering" is imported from docker/keycloak (clients provider-a, provider-b, backoffice).
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: wagering_keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # tokens carry this issuer for every caller (host and containers alike)
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  # ---------------------------------------------------------------- application (profile "app")
  # docker compose --profile app up -d --build  → migrations, then 3 identical instances.
  migrate:
    profiles: ["app"]
    build: .
    image: wagering-processor:local
    command: ["bun", "src/infrastructure/persistence/migrate.ts", "up"]
    environment: &app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wagering_db
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: info
      # AUTH_MODE=oidc docker compose --profile app --profile auth up -d --build
      AUTH_MODE: ${AUTH_MODE:-none}
      OIDC_ISSUER: http://localhost:8080/realms/wagering
      OIDC_JWKS_URI: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy

  app1: &app
    profiles: ["app"]
    build: .
    image: wagering-processor:local
    init: true # tini as PID 1: forwards SIGTERM, reaps zombies
    stop_grace_period: 30s # > SHUTDOWN_GRACE_MS
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports:
      - "3002:3000"

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3
    ports:
      - "3003:3000"

volumes:
  postgres_data:
  localstack_data:
